name: CI (macOS 10.15 Catalina, Intel)

# Build, test and run the app on an Intel macOS runner, with the companion repositories checked out in place: the plugins are
# built and tested, STEMS separates a generated tone through ONNX Runtime 1.16.3, then the built app is started with a private
# home, left running, screenshotted and closed (.github/smoke.sh).
#
# One platform only, like the releases: macOS x86_64 with the 10.15 deployment target from `.cargo/config.toml`. No 10.15 runner
# exists, so this runs on the runner's newer macOS and `.github/check-minos.sh` fails the build if any binary or library claims a
# newer minimum.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The last ONNX Runtime with a macOS x86_64 build for 10.15 (`minos 10.14`); 1.17+ needs 11.0.
  ORT_VERSION: "1.16.3"
  ORT_SHA256: "a395923ed91192e46bf50aec48d728dbf193dbd547ad50a231ba32df51608507"

jobs:
  test:
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Companions (plugins, themes, mappings)
        run: |
          git clone --depth 1 https://github.com/ronellcl/MyOpenFadeR-Plugins.git extension/plugin
          mkdir -p extension/plugin/.cargo
          printf '[patch."https://github.com/OpenRsG/OpenFadeR"]\nopenfader-plugin = { path = "../../sdk" }\n' > extension/plugin/.cargo/config.toml
          git clone --depth 1 https://github.com/OpenRsG/OpenFadeR-Themes.git extension/skin
          git clone --depth 1 https://github.com/OpenRsG/OpenFadeR-Map.git mappings
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extension/plugin
          cache-on-failure: true
      - name: Build the plugins
        run: extension/plugin/build.sh --quiet
      - run: cargo build --release
      - name: Static ffmpeg and ffprobe
        # The same ones the archive ships, and it is worth checking here: they are old binaries (LC_VERSION_MIN_MACOSX, no
        # `minos` for `vtool`), which is exactly the case the gate has to read with `otool`.
        run: python3 .github/fetch_tools.py
      - name: Every binary targets no newer than 10.15
        run: bash .github/check-minos.sh target/release/openfader target/release/*.dylib tools/*
      - name: Tests
        # Two tests read whatever the companion repositories hold *today* and compare it with this tree's parsers: the current
        # themes use tokens added after 0.4.2 (`locales`, `layout-profile`, `studio-*`) and `Pioneer_DJ_XDJ-RX2.xml` repeats a
        # (status, midino). Both are about the companions drifting from this pinned version, not about this tree: the app still
        # loads those themes (unknown tokens are ignored), and the smoke test below loads them. The other 512 tests run.
        run: |
          cargo test --release -- \
            --skip app::midi::mapfile::tests::every_checked_out_mapping_reads_back_to_the_same_file \
            --skip app::skin::file::tests::the_checked_out_themes_load_without_a_note_and_are_complete
      # No plugin tests here. The plugins are built (above, against this tree's `sdk/`, which is what the bundle ships) but their
      # own tests are written against the SDK of the current MyOpenFadeR: they use `DeviceInfo::title`/`about` and the newer
      # `merge` signature, added after 0.4.2. Same drift as the two skipped tests, same conclusion: this tree is a pinned
      # version, the companions are not.
      - name: ONNX Runtime
        # Loaded at run time (`libloading`), so nothing above needed it; the app finds it in Contents/Frameworks.
        run: |
          curl -sSL -o ort.tgz "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          echo "${ORT_SHA256}  ort.tgz" | shasum -a 256 -c -
          tar xzf ort.tgz
      - name: STEMS
        # The whole reason for this tree: ONNX Runtime 1.16.3 driving htdemucs on 10.15. A generated tone goes through the same
        # `Job` a deck starts; `stems_bench` fails if the four stems do not add up to the original.
        env:
          ORT_DYLIB_PATH: ${{ github.workspace }}/onnxruntime-osx-x86_64-1.16.3/lib/libonnxruntime.1.16.3.dylib
          OPENFADER_STEMS_GPU: "0"
        run: |
          python3 - <<'PY'
          import math, struct, wave
          rate, secs = 44100, 12
          frames = bytearray()
          for i in range(rate * secs):
              t = i / rate
              left = 0.3 * math.sin(2 * math.pi * 220 * t) + 0.2 * math.sin(2 * math.pi * 1760 * t)
              right = 0.3 * math.sin(2 * math.pi * 330 * t) + 0.2 * math.sin(2 * math.pi * 3520 * t)
              frames += struct.pack('<hh', int(left * 20000), int(right * 20000))
          with wave.open('tone.wav', 'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(rate); w.writeframes(bytes(frames))
          PY
          cargo build --release --example stems_bench
          ./target/release/examples/stems_bench tone.wav quality
      - name: Smoke test
        run: bash .github/smoke.sh target/release/openfader smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke/
          if-no-files-found: ignore
